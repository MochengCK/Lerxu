<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LinkCore Download Manager</title>
  <style>
    :root {
      --primary-color: #409eff;
      --success-color: #67c23a;
      --warning-color: #e6a23c;
      --danger-color: #f56c6c;
      --text-primary: #303133;
      --text-regular: #606266;
      --text-secondary: #909399;
      --border-color: #dcdfe6;
      --surface-color: #ffffff;
      --card-color: #ffffff;
      --panel-color: #f5f7fa;
      --header-bg: #ffffff;
    }

    html.theme-dark {
      --text-primary: #e5eaf3;
      --text-regular: #c0c4cc;
      --text-secondary: #909399;
      --border-color: #303133;
      --surface-color: #141414;
      --card-color: #1d1d1d;
      --panel-color: #1f1f1f;
      --header-bg: #141414;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      margin: 0; 
      min-width: 320px; 
      background: var(--surface-color);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
    }
    
    .header {
      background: var(--header-bg);
      color: var(--text-primary);
      padding: 16px;
      text-align: center;
      position: relative;
    }
    
    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 16px;
      right: 16px;
      height: 1px;
      background: var(--border-color);
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    
    .content {
      padding: 16px;
    }
    
    .speed-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      position: relative;
    }
    
    .speed-stats::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--border-color);
      transform: translateX(-50%);
    }
    
    .speed-item {
      flex: 1;
      text-align: center;
    }
    
    .speed-label {
      color: var(--text-secondary);
      font-size: 12px;
      margin-bottom: 4px;
    }
    
    .speed-value {
      font-weight: 600;
      font-size: 18px;
      color: var(--text-primary);
    }
    
    .speed-divider {
      height: 1px;
      background: var(--border-color);
      margin: 12px 0 16px 0;
    }
    
    .status-card {
      background: var(--panel-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    
    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .status-item:last-child {
      margin-bottom: 0;
    }
    
    .status-label {
      color: var(--text-regular);
      font-size: 13px;
    }
    
    .status-value {
      font-weight: 500;
      font-size: 13px;
    }
    
    .status-connected { color: var(--success-color); }
    .status-disconnected { color: var(--danger-color); }
    
    .settings-section {
      padding-top: 0;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
    }
    
    .checkbox-group label {
      font-size: 13px;
      color: var(--text-regular);
      cursor: pointer;
    }
    
    .quick-actions {
      margin-top: 16px;
    }
    
    .quick-action-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border: none;
      border-radius: 6px;
      background: var(--panel-color);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      overflow: hidden;
      box-sizing: border-box;
    }
    
    .quick-action-btn span {
      display: inline-block;
      white-space: nowrap;
      will-change: transform, opacity;
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .quick-action-btn span.slide-out {
      transform: translateX(100%);
      opacity: 0;
    }
    
    .quick-action-btn span.slide-out-left {
      transform: translateX(-100%);
      opacity: 0;
    }
    
    .quick-action-btn span.prep-left {
      transform: translateX(-100%);
      opacity: 0;
      transition: none;
    }
    
    .quick-action-btn span.prep-right {
      transform: translateX(100%);
      opacity: 0;
      transition: none;
    }
    
    .quick-action-btn:hover {
      border-color: transparent;
      background: var(--panel-color);
      opacity: 0.8;
    }
    
    .quick-action-btn.added {
      border-color: transparent;
    }
    
    .quick-action-btn.added:hover {
      border-color: transparent;
    }
    
    .skip-file-type-section {
      margin-top: 12px;
    }
    
    .input-group {
      display: flex;
      position: relative;
      border: none;
      border-radius: 6px;
      background: var(--card-color);
      transition: border-color 0.2s ease;
      overflow: hidden;
    }
    
    .input-group:focus-within {
      border-color: transparent;
    }
    
    .skip-file-type-input {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      will-change: transform, opacity;
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .skip-file-type-input.slide-out {
      transform: translateX(50px);
      opacity: 0;
    }
    
    .skip-file-type-input.slide-out-left {
      transform: translateX(-50px);
      opacity: 0;
    }
    
    .skip-file-type-input.prep-left {
      transform: translateX(-50px);
      opacity: 0;
      transition: none;
    }
    
    .skip-file-type-input.prep-right {
      transform: translateX(50px);
      opacity: 0;
      transition: none;
    }
    
    .add-skip-file-type-btn {
      position: relative;
      min-width: 60px;
      padding: 8px 12px;
      border: none;
      border-radius: 0 5px 5px 0;
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      opacity: 1;
      transform: translateX(0);
      transition: background 0.2s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    
    .add-skip-file-type-btn:hover {
      background: var(--panel-color);
    }
    
    .add-skip-file-type-btn:disabled {
      color: var(--text-secondary);
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .settings-divider {
      height: 1px;
      background: var(--border-color);
      margin: 16px 0;
    }
    
    .footer {
      padding: 12px 16px;
      text-align: center;
    }
    
    .footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 12px;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="popupTitle">LinkCore Download Manager</h1>
  </div>
  
  <div class="content">
    <div class="speed-stats">
      <div class="speed-item">
        <div class="speed-label" id="labelDownloadSpeed">下载速度</div>
        <div class="speed-value" id="downloadSpeed">-</div>
      </div>
      <div class="speed-item">
        <div class="speed-label" id="labelUploadSpeed">上传速度</div>
        <div class="speed-value" id="uploadSpeed">-</div>
      </div>
    </div>
    
    <div class="speed-divider"></div>
    
    <div class="status-card">
      <div class="status-item">
        <span class="status-label" id="labelRpc">RPC 地址</span>
        <span class="status-value" id="rpc">-</span>
      </div>
      <div class="status-item">
        <span class="status-label" id="labelConn">连接状态</span>
        <span class="status-value" id="conn">-</span>
      </div>
      <div class="status-item">
        <span class="status-label" id="labelClientVersion">客户端版本</span>
        <span class="status-value" id="clientVersion">-</span>
      </div>
    </div>
    
    <div class="settings-section">
      <div class="skip-file-type-section">
        <div class="input-group">
          <input type="text" id="skipFileTypeInput" class="skip-file-type-input" placeholder="输入文件扩展名" />
          <button id="addSkipFileTypeBtn" class="add-skip-file-type-btn">
            <span id="labelAdd">添加</span>
          </button>
        </div>
      </div>
      
      <div class="quick-actions" style="margin-top: 8px;">
        <button id="excludeCurrentSiteBtn" class="quick-action-btn">
          <span id="labelExcludeCurrentSite">不接管此网站</span>
        </button>
      </div>
    </div>
  </div>
  
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
  <script src="key-listener.js"></script>
</body>
</html>
