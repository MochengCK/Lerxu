<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>添加格式 - Lerxu</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <style>
    :root {
      --lc-color-primary: #1a7fe0;
      --lc-color-primary-rgb: 26, 127, 224;
      --lc-color-success: #67c23a;
      --lc-color-danger: #f56c6c;
      --lc-text-inverse: #ffffff;
    }
    body.dark {
      --lc-color-primary: #4a9eff;
      --lc-color-primary-rgb: 74, 158, 255;
      --lc-color-danger: #f56c6c;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #fff;
      color: #333;
      padding: 0;
      transition: background 0.3s, color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #262a31;
        color: #e0e0e0;
      }
    }

    body.dark {
      background: #262a31;
      color: #e0e0e0;
    }

    .container {
      width: 100%;
      background: #fff;
      padding: 24px;
      transition: background 0.3s;
    }

    body.use-custom-frame .container {
      padding-top: 56px;
      /* 32px title bar + 24px padding */
    }

    body.dark .container {
      background: #262a31;
    }

    .form-item {
      margin-bottom: 20px;
    }

    .form-item:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #5a6c7d;
      transition: color 0.3s;
    }

    body.dark .form-label {
      color: #b0b0b0;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d3dde6;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      background: #fff;
      color: #333;
    }

    body.dark input[type="text"] {
      border-color: #363b44;
      background: #2a2e35;
      color: #e0e0e0;
    }

    input[type="text"]:focus {
      border-color: var(--lc-color-primary);
    }

    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 20px;
    }

    .button-group button {
      flex: 1;
      padding: 8px 16px;
      background: var(--lc-color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background .3s;
    }

    .button-group button:hover {
      background: #66b1ff;
    }

    .button-group button:active {
      background: #3a8ee6;
    }

    .button-secondary {
      background: #fff;
      color: #5a6c7d;
      border: 1px solid #d3dde6;
    }

    body.dark .button-secondary {
      background: #2a2e35;
      color: #b0b0b0;
      border-color: #363b44;
    }

    .button-secondary:hover {
      background: #f0f4f8;
      border-color: #c6e2ff;
      color: var(--lc-color-primary);
    }

    body.dark .button-secondary:hover {
      background: #444444;
      border-color: var(--lc-color-primary);
      color: var(--lc-color-primary);
    }

    .title-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #fff;
      z-index: 1000;
      transition: background 0.3s;
    }

    body.dark .title-bar {
      background: #262a31;
    }

    body.use-custom-frame .title-bar {
      display: flex;
      -webkit-app-region: drag;
    }

    .title-text {
      font-size: 12px;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
      color: #303133;
      transition: color 0.3s;
    }

    body.use-custom-frame .title-text {
      -webkit-app-region: drag;
    }

    body.dark .title-text {
      color: #e0e0e0;
    }

    .title-actions {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .title-btn {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: none;
      background: transparent;
      color: #303133;
      cursor: pointer;
      padding: 0;
      font-size: 14px;
      line-height: 18px;
      transition: background 0.3s, color 0.3s;
    }

    body.dark .title-btn {
      color: #e0e0e0;
    }

    .title-btn:hover {
      background-color: rgba(0, 0, 0, 0.08);
    }

    body.dark .title-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>

<body>
  <script>
    (function () {
      try {
        const { ipcRenderer } = require('electron')
        const appConfig = ipcRenderer.sendSync('get-app-config')
        if (appConfig && appConfig.theme) {
          const theme = appConfig.theme
          if (theme === 'dark') {
            document.body.classList.add('dark')
          } else if (theme === 'auto') {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.body.classList.add('dark')
            }
          }
        }
        if (appConfig && appConfig['hide-app-menu']) {
          document.body.classList.add('use-custom-frame')
        }
      } catch (e) { }
    })()
  </script>
  <div class="title-bar">
    <span class="title-text" id="titleText">添加格式</span>
    <div class="title-actions">
      <button class="title-btn" id="closeBtn">×</button>
    </div>
  </div>
  <div class="container">
    <div class="form-item">
      <label class="form-label" id="formatLabel">格式</label>
      <input type="text" id="formatInput" placeholder="输入格式（如 mp4）" />
    </div>
    <div class="button-group">
      <button class="button-secondary" id="cancelBtn">取消</button>
      <button id="confirmBtn">确定</button>
    </div>
  </div>

  <script src="./video-sniffer-add-format.js"></script>
</body>

</html>
