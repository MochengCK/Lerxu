<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>文件分类设置 - LinkCore Download Manager</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 14px;
        background: #fff;
        color: #333;
        transition: background 0.3s, color 0.3s;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1a1a;
          color: #e0e0e0;
        }
      }

      body.dark {
        background: #1a1a1a;
        color: #e0e0e0;
      }

      /* 自定义标题栏 */
      .title-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: transparent;
        z-index: 1000;
        -webkit-app-region: drag;
      }

      .title-text {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-right: 8px;
        color: #303133;
        -webkit-app-region: drag;
      }

      body.dark .title-text {
        color: #e0e0e0;
      }

      .title-actions {
        display: flex;
        gap: 4px;
        -webkit-app-region: no-drag;
      }

      .title-btn {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        border: none;
        background: transparent;
        color: #606266;
        cursor: pointer;
        padding: 0;
        font-size: 14px;
        line-height: 24px;
        transition: background 0.3s, color 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body.dark .title-btn {
        color: #b0b0b0;
      }

      .title-btn:hover {
        background-color: rgba(0, 0, 0, 0.08);
        color: #303133;
      }

      body.dark .title-btn:hover {
        background-color: rgba(255, 255, 255, 0.12);
        color: #e0e0e0;
      }

      .title-btn.close:hover {
        background-color: #f56c6c;
        color: #fff;
      }

      /* 主布局 */
      .main-layout {
        height: 100vh;
        padding-top: 32px;
        display: flex;
        flex-direction: column;
      }

      /* 列表区域 - 可滚动 */
      .list-container {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }

      /* 列表区域自定义滚动条 */
      .list-container::-webkit-scrollbar {
        width: 8px;
      }

      .list-container::-webkit-scrollbar-track {
        background: transparent;
      }

      .list-container::-webkit-scrollbar-thumb {
        background: #c0c4cc;
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      .list-container::-webkit-scrollbar-thumb:hover {
        background: #909399;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      body.dark .list-container::-webkit-scrollbar-thumb {
        background: #4a4a4a;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      body.dark .list-container::-webkit-scrollbar-thumb:hover {
        background: #5a5a5a;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      .category-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .category-item {
        padding: 6px 0;
      }

      .category-header {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      input[type="text"] {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid #dcdfe6;
        border-radius: 4px;
        font-size: 13px;
        outline: none;
        transition: border-color .2s, background 0.3s, color 0.3s;
        background: #fff;
        color: #333;
        min-width: 0;
      }

      body.dark input[type="text"] {
        border-color: #4a4a4a;
        background: #1a1a1a;
        color: #e0e0e0;
      }

      input[type="text"]:focus {
        border-color: #409EFF;
      }

      input[type="text"].name-input {
        flex: 0 0 130px;
      }

      input[type="text"].extensions-input {
        flex: 1;
      }

      button {
        padding: 6px 12px;
        background: #409EFF;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: background .3s;
        white-space: nowrap;
      }

      button:hover {
        background: #66b1ff;
      }

      button:active {
        background: #3a8ee6;
      }

      button:disabled {
        background: #c0c4cc;
        cursor: not-allowed;
      }

      body.dark button:disabled {
        background: #4a4a4a;
      }

      button.danger {
        background: #f56c6c;
      }

      button.danger:hover {
        background: #f78989;
      }

      button.danger:active {
        background: #dd6161;
      }

      button.danger:disabled {
        background: #c0c4cc;
      }

      /* 底部按钮区 */
      .button-group {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 16px 16px 16px;
      }

      .add-category-btn {
        width: 100%;
        padding: 6px 12px;
        font-size: 13px;
        background: #409EFF;
      }

      .add-category-btn:hover {
        background: #66b1ff;
      }

      .add-category-btn:active {
        background: #3a8ee6;
      }

      .button-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .button-row button {
        flex: 1;
      }

      .button-secondary {
        background: #909399;
      }

      .button-secondary:hover {
        background: #a6a9ad;
      }

      .button-secondary:active {
        background: #82848a;
      }

      body.dark .button-secondary {
        background: #606266;
      }

      body.dark .button-secondary:hover {
        background: #7a7c80;
      }

      .empty-tip {
        text-align: center;
        color: #909399;
        padding: 40px 0;
        font-size: 14px;
      }

      body.dark .empty-tip {
        color: #606060;
      }

      .confirm-dialog {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 2000;
        align-items: center;
        justify-content: center;
      }

      .confirm-dialog.show {
        display: flex;
      }

      .confirm-dialog-content {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 360px;
        width: 90%;
      }

      body.dark .confirm-dialog-content {
        background: #2a2a2a;
      }

      .confirm-dialog-title {
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 12px;
        color: #303133;
      }

      body.dark .confirm-dialog-title {
        color: #e0e0e0;
      }

      .confirm-dialog-message {
        font-size: 14px;
        color: #606266;
        margin-bottom: 20px;
      }

      body.dark .confirm-dialog-message {
        color: #b0b0b0;
      }

      .confirm-dialog-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <script>
      (function() {
        try {
          const { ipcRenderer } = require('electron')
          const appConfig = ipcRenderer.sendSync('get-app-config')
          if (appConfig && appConfig.theme) {
            const theme = appConfig.theme
            if (theme === 'dark') {
              document.body.classList.add('dark')
            } else if (theme === 'auto') {
              if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark')
              }
            }
          }
        } catch (e) {}
      })()
    </script>
    <!-- 自定义标题栏 -->
    <div class="title-bar">
      <span class="title-text" id="titleText">文件分类设置</span>
      <div class="title-actions">
        <button class="title-btn" id="minimizeBtn">−</button>
        <button class="title-btn close" id="closeBtn">×</button>
      </div>
    </div>

    <!-- 主布局 -->
    <div class="main-layout">
      <!-- 列表区域 - 单独滚动 -->
      <div class="list-container">
        <div class="category-list" id="categoryList"></div>
      </div>

      <!-- 底部按钮区 - 固定不滚动 -->
      <div class="button-group">
        <button class="add-category-btn" id="addCategoryBtn">
          <span id="addCategoryText">+ 添加分类</span>
        </button>
        <div class="button-row">
          <button class="button-secondary" id="resetBtn">恢复默认</button>
          <button id="saveBtn">保存</button>
        </div>
      </div>
    </div>

    <!-- 确认对话框 -->
    <div class="confirm-dialog" id="confirmDialog">
      <div class="confirm-dialog-content">
        <div class="confirm-dialog-title" id="confirmTitle">确认</div>
        <div class="confirm-dialog-message" id="confirmMessage">确定要删除此分类吗？</div>
        <div class="confirm-dialog-buttons">
          <button class="button-secondary" id="confirmCancel">取消</button>
          <button id="confirmOk">确定</button>
        </div>
      </div>
    </div>

    <script src="./file-categories.js"></script>
  </body>
</html>
