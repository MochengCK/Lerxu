<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>视频嗅探设置 - LinkCore</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <style>
    :root {
      --lc-color-primary: #1a7fe0;
      --lc-color-primary-rgb: 26, 127, 224;
      --lc-color-success: #67c23a;
      --lc-color-danger: #f56c6c;
      --lc-text-inverse: #ffffff;
    }
    body.dark {
      --lc-color-primary: #4a9eff;
      --lc-color-primary-rgb: 74, 158, 255;
      --lc-color-danger: #f56c6c;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      color: #333;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #262a31;
        color: #e0e0e0;
      }
    }

    body.dark {
      background: #262a31;
      color: #e0e0e0;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      background: #fff;
      padding: 24px;
      transition: background 0.3s;
      overflow-y: auto;
    }

    body.use-custom-frame .container {
      padding-top: 50px;
      /* 26px title bar + 24px padding */
    }

    body.dark .container {
      background: #262a31;
    }

    .form-item {
      margin-bottom: 20px;
    }

    .form-item:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #5a6c7d;
      transition: color 0.3s;
    }

    body.dark .form-label {
      color: #b0b0b0;
    }

    .form-tip {
      font-size: 12px;
      color: #8492a6;
      margin-top: 4px;
      transition: color 0.3s;
    }

    body.dark .form-tip {
      color: #606060;
    }

    .switch-wrapper {
      display: flex;
      align-items: center;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
      margin-right: 8px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d3dde6;
      transition: .4s;
      border-radius: 20px;
    }

    body.dark .slider {
      background-color: #363b44;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    body.dark .slider:before {
      background-color: #e0e0e0;
    }

    input:checked+.slider {
      background-color: var(--lc-color-primary);
    }

    input:checked+.slider:before {
      transform: translateX(20px);
    }

    .format-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .format-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      background: #ecf5ff;
      border: 1px solid #d9ecff;
      border-radius: 4px;
      color: var(--lc-color-primary);
      font-size: 12px;
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
    }

    body.dark .format-tag {
      background: #1e3a5f;
      border-color: #1e4a7f;
      color: var(--lc-color-primary);
    }

    .format-tag .remove-btn {
      margin-left: 8px;
      cursor: pointer;
      color: #8492a6;
      font-size: 14px;
    }

    body.dark .format-tag .remove-btn {
      color: #606060;
    }

    .format-tag .remove-btn:hover {
      color: var(--lc-color-danger);
    }

    .format-tag.add-btn {
      cursor: pointer;
      border: 1px dashed #d9ecff;
      background: transparent;
      color: var(--lc-color-primary);
    }

    .format-tag.add-btn:hover {
      background: #ecf5ff;
    }

    body.dark .format-tag.add-btn {
      border-color: #1e4a7f;
      color: var(--lc-color-primary);
    }

    body.dark .format-tag.add-btn:hover {
      background: #1e3a5f;
    }

    .add-format {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d3dde6;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      background: #fff;
      color: #333;
    }

    body.dark input[type="text"] {
      border-color: #363b44;
      background: #2a2e35;
      color: #e0e0e0;
    }

    input[type="text"]:focus {
      border-color: var(--lc-color-primary);
    }

    button {
      padding: 8px 16px;
      background: var(--lc-color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background .3s;
    }

    button:hover {
      background: #66b1ff;
    }

    button:active {
      background: #3a8ee6;
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: -20px;
      padding-top: 20px;
    }

    .button-group button {
      width: 100%;
      min-width: 80px;
    }

    .button-secondary {
      background: #fff;
      color: #5a6c7d;
      border: 1px solid #d3dde6;
    }

    body.dark .button-secondary {
      background: #2a2e35;
      color: #b0b0b0;
      border-color: #363b44;
    }

    .button-secondary:hover {
      background: #f0f4f8;
      border-color: #c6e2ff;
      color: var(--lc-color-primary);
    }

    body.dark .button-secondary:hover {
      background: #444444;
      border-color: var(--lc-color-primary);
      color: var(--lc-color-primary);
    }

    .title-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 26px;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-left: 78px;
      background: #fff;
      z-index: 1000;
      transition: background 0.3s;
    }

    body.use-custom-frame .title-bar {
      display: flex;
      -webkit-app-region: drag;
    }

    body.macos .title-bar {
      justify-content: flex-end;
      padding-top: 10px;
      padding-right: 8px;
    }

    body.macos .title-actions {
      display: none;
    }

    body.dark .title-bar {
      background: #262a31;
    }

    .title-text {
      font-size: 12px;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
      line-height: 26px;
      color: #303133;
      transition: color 0.3s;
    }

    body.use-custom-frame .title-text {
      -webkit-app-region: drag;
    }

    body.dark .title-text {
      color: #e0e0e0;
    }

    .title-actions {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .title-btn {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: none;
      background: transparent;
      color: #303133;
      cursor: pointer;
      padding: 0;
      font-size: 14px;
      line-height: 18px;
      transition: background 0.3s, color 0.3s;
    }

    body.dark .title-btn {
      color: #e0e0e0;
    }

    .title-btn:hover {
      background-color: rgba(0, 0, 0, 0.08);
    }

    body.dark .title-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>

<body>
  <script>
    (function () {
      try {
        const { ipcRenderer } = require('electron')
        const appConfig = ipcRenderer.sendSync('get-app-config')
        if (appConfig && appConfig.theme) {
          const theme = appConfig.theme
          if (theme === 'dark') {
            document.body.classList.add('dark')
          } else if (theme === 'auto') {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.body.classList.add('dark')
            }
          }
        }
        if (appConfig && appConfig['hide-app-menu']) {
          document.body.classList.add('use-custom-frame')
        }
        if (process && process.platform === 'darwin') {
          document.body.classList.add('use-custom-frame')
          document.body.classList.add('macos')
        }
      } catch (e) { }
    })()
  </script>
  <div class="title-bar">
    <span class="title-text" id="titleText">视频嗅探设置</span>
    <div class="title-actions">
      <button class="title-btn" id="minimizeBtn">−</button>
      <button class="title-btn" id="closeBtn">×</button>
    </div>
  </div>
  <div class="container">
    <div class="form-item">
      <label class="form-label">
        <div class="switch-wrapper">
          <label class="switch">
            <input type="checkbox" id="videoSnifferEnabled">
            <span class="slider"></span>
          </label>
          <span id="videoSnifferEnabledLabel">启用视频资源嗅探</span>
        </div>
      </label>
      <div class="form-tip" id="videoSnifferEnabledTips">启用后，浏览器扩展将自动检测视频资源</div>
    </div>

    <div class="form-item">
      <label class="form-label">
        <div class="switch-wrapper">
          <label class="switch">
            <input type="checkbox" id="videoSnifferAutoCombine">
            <span class="slider"></span>
          </label>
          <span id="videoSnifferAutoCombineLabel">自动合并 DASH 视频</span>
        </div>
      </label>
      <div class="form-tip" id="videoSnifferAutoCombineTips">检测到DASH格式时，自动显示完整视频（视频+音频）下载选项</div>
    </div>

    <div class="form-item">
      <label class="form-label" id="videoSnifferFormatsLabel">嗅探格式</label>
      <div class="format-list" id="formatList"></div>
      <div class="form-tip" id="videoSnifferFormatsTips">设置要嗅探的视频文件扩展名</div>
    </div>

    <div class="button-group">
      <button class="button-secondary" id="resetBtn">恢复默认</button>
    </div>
  </div>

  <script src="./video-sniffer.js"></script>
</body>

</html>
