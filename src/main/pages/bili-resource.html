<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>下载视频</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:">
  <script src="./bili-resource-theme.js"></script>
  <style>
    :root {
      --bg: #f0f4f8;
      --panel: #ffffff;
      --text: #1f2329;
      --text-2: #646a73;
      --text-3: #8f959e;
      --border: #dfe4ea;
      --hover: #f2f3f5;
      --primary: #1a7fe0;
      --primary-hover: #166fce;
      --danger: #f54a45;
      --radius: 8px;
    }

    html.dark {
      --bg: #1e2228;
      --panel: #262a31;
      --text: #e8eaed;
      --text-2: #a8b0bb;
      --text-3: #7d848f;
      --border: #363b44;
      --hover: #2d323a;
      --primary: #4a9eff;
      --primary-hover: #6cb0ff;
      --danger: #ff6b66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      /* 窗口高度由页面内容反推（见 resizeWindowToContent）：
         外层永不出现滚动条，只有集数表内部允许滚动。 */
      overflow: hidden;
    }

    html {
      /* 根元素也要上色：首帧由 html 铺底，避免窗口表面露出白色 */
      background: var(--bg);
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* ── 标题栏：与独立任务进度窗口同一套形态（26px、可拖动） ── */
    .title-bar {
      display: none;
      flex-shrink: 0;
      height: 26px;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-left: 78px;
      -webkit-app-region: drag;
      background: var(--bg);
      user-select: none;
    }

    body.show-title-bar .title-bar {
      display: flex;
    }

    .title-text {
      font-size: 12px;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .title-actions {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .title-btn {
      width: 18px;
      height: 18px;
      padding: 0;
      border: none;
      border-radius: 3px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 18px;
      cursor: pointer;
    }

    .title-btn:hover {
      background: var(--hover);
    }

    body.mac .title-bar {
      /* 与进度窗一致：26px 内容 + 6px 上留白 = 32px，文字与左侧红绿灯垂直居中 */
      height: 32px;
      justify-content: flex-end;
      padding-top: 6px;
      padding-right: 8px;
      padding-left: 78px;
    }

    body.mac .title-actions {
      display: none;
    }

    /* ── 内容 ── */
    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 4px 16px 8px;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
    }

    /* hidden 属性在 .setting-row 的 display:flex 下会被作者样式覆盖，
       直播模式隐藏音频 / 合并格式时必须显式关掉 */
    .setting-row[hidden] {
      display: none;
    }

    .setting-info {
      min-width: 0;
    }

    .setting-title {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    .setting-subtitle {
      margin-top: 1px;
      font-size: 11px;
      color: var(--text-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── 番剧集数表（只在该资源窗带 episodes 时出现） ── */
    .episode-block {
      padding: 2px 0 6px;
    }

    .episode-head {
      display: flex;
      align-items: baseline;
    }

    .episode-head-title {
      display: inline-flex;
      align-items: baseline;
      min-width: 0;
    }

    .episode-hint {
      margin-top: 0;
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
    }

    /* 与任务详情里的文件表同一套形态：外框 1px + 8px 圆角，
       表头浅底，行分隔线左右各缩进 8px，不画整行边框。 */
    .episode-table {
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .episode-thead,
    .episode-item {
      display: grid;
      grid-template-columns: 30px 62px minmax(0, 1fr) 48px;
      align-items: center;
      column-gap: 6px;
      padding: 0 8px;
    }

    .episode-thead {
      height: 30px;
      background: var(--hover);
      color: var(--text-3);
      font-size: 12px;
      white-space: nowrap;
    }

    .episode-list {
      /* 7 行 × 32px：刚好整行，不让最后一行被截半截 */
      max-height: 224px;
      overflow-y: auto;
      background: var(--panel);
    }

    .episode-list:empty {
      display: none;
    }

    .episode-item {
      position: relative;
      height: 32px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
    }

    .episode-item:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: 1px;
      background: var(--border);
    }

    .episode-item:hover {
      background: var(--hover);
    }

    .episode-check {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      min-width: 0;
    }

    .episode-col-index,
    .episode-col-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .episode-col-index {
      color: var(--text-2);
    }

    .episode-col-title {
      color: var(--text);
    }

    .episode-col-duration {
      color: var(--text-3);
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }

    /* 勾选框：与新建任务 / 文件列表里的勾选框同一形态
       （16px、4px 圆角、主题色实底、白色对勾；半选为白色横杠）。 */
    .lx-checkbox {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
      cursor: pointer;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .lx-checkbox:hover {
      border-color: var(--primary);
    }

    .lx-checkbox:checked,
    .lx-checkbox:indeterminate {
      border-color: var(--primary);
      background: var(--primary);
    }

    .lx-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 44%;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 1.5px 1.5px 0;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .lx-checkbox:indeterminate::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 2px;
      border-radius: 1px;
      background: #fff;
      transform: translate(-50%, -50%);
    }

    .episode-list::-webkit-scrollbar {
      width: 6px;
    }

    .episode-list::-webkit-scrollbar-thumb {
      border-radius: 3px;
      background: var(--border);
    }

    /* ── 自绘下拉（不用系统自带的 select） ── */
    .lx-select {
      position: relative;
      flex-shrink: 0;
      width: 148px;
    }

    .lx-select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.12s ease;
    }

    .lx-select-trigger:hover {
      border-color: var(--text-3);
    }

    .lx-select.open .lx-select-trigger {
      border-color: var(--primary);
    }

    .lx-select.disabled .lx-select-trigger {
      opacity: 0.55;
      cursor: default;
    }

    .lx-select-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lx-select-arrow {
      flex-shrink: 0;
      width: 12px;
      height: 12px;
      color: var(--text-3);
      transition: transform 0.15s ease;
      /* SVG 默认以左上角为旋转中心，会让展开态的箭头转出可视区 */
      transform-box: fill-box;
      transform-origin: center;
    }

    .lx-select-arrow path {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .lx-select.open .lx-select-arrow {
      transform: rotate(180deg);
    }

    .lx-select-menu {
      position: fixed;
      z-index: 1000;
      max-height: 220px;
      overflow-y: auto;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      opacity: 0;
      transform: translateY(-4px) scale(0.98);
      transform-origin: top center;
      transition: opacity 140ms ease, transform 140ms ease;
      pointer-events: none;
    }

    .lx-select-menu[hidden] {
      display: none;
    }

    .lx-select-menu.drop-up {
      transform: translateY(4px) scale(0.98);
      transform-origin: bottom center;
    }

    .lx-select-menu.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .lx-select-menu::-webkit-scrollbar {
      width: 6px;
    }

    .lx-select-menu::-webkit-scrollbar-thumb {
      border-radius: 3px;
      background: var(--border);
    }

    .lx-select-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 30px;
      padding: 0 8px;
      border-radius: 5px;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      cursor: pointer;
    }

    .lx-select-option:hover {
      background: var(--hover);
    }

    .lx-select-option.selected {
      color: var(--primary);
    }

    .lx-select-check {
      flex-shrink: 0;
      font-size: 12px;
    }

    /* ── 视频信息（封面 + 标题） ── */
    .video-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 4px 0 6px;
    }

    .video-thumb {
      position: relative;
      flex-shrink: 0;
      width: 128px;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: var(--hover);
    }

    .video-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-thumb.empty::after {
      content: '暂无封面';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-3);
    }

    .video-info {
      flex: 1;
      min-width: 0;
      padding-top: 1px;
    }

    .video-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text);
    }

    .video-meta {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-3);
      min-width: 0;
    }

    .video-meta-text {
      min-width: 0;
      overflow: hidden;
      color: var(--text-2);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .video-size {
      flex-shrink: 0;
      color: var(--text-2);
      white-space: nowrap;
    }

    /* ── 底部 ── */
    .footer {
      flex-shrink: 0;
      padding: 8px 12px 10px;
      background: var(--bg);
    }

    .btn {
      height: 34px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .btn-primary {
      width: 100%;
      height: 34px;
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    /* ── 状态 ── */
    .state {
      padding: 40px 0;
      text-align: center;
      font-size: 12px;
      color: var(--text-2);
    }

    .state.error {
      color: var(--danger);
    }

    .tip {
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-3);
    }

    .error-text {
      color: var(--danger);
    }
  </style>
</head>

<body>
  <div class="title-bar" id="titleBar">
    <div class="title-text" id="windowTitle">下载视频</div>
    <div class="title-actions">
      <button class="title-btn" id="minBtn" type="button" title="最小化">–</button>
      <button class="title-btn" id="closeBtn" type="button" title="关闭">×</button>
    </div>
  </div>

  <main class="content">
    <div class="state" id="loading">正在读取资源…</div>
    <div class="state error" id="error" hidden></div>

    <div id="form" hidden>
      <div class="video-head">
        <div class="video-thumb" id="videoThumbWrap">
          <img id="videoThumb" alt="" referrerpolicy="no-referrer">
        </div>
        <div class="video-info">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-meta">
            <span class="video-meta-text" id="videoMeta"></span>
            <span class="video-size" id="videoSize"></span>
          </div>
        </div>
      </div>

      <div class="episode-block" id="episodeBlock" hidden>
        <div class="episode-head">
          <div class="episode-head-title">
            <span class="setting-title" id="episodeHeadLabel">集数</span>
            <span class="episode-hint" id="episodeHint"></span>
          </div>
        </div>
        <div class="episode-table">
          <div class="episode-thead">
            <span class="episode-check">
              <input type="checkbox" id="episodeAll" class="lx-checkbox" aria-label="全选" title="全选">
            </span>
            <span class="episode-col-index" id="episodeIndexHead">集数</span>
            <span class="episode-col-title">标题</span>
            <span class="episode-col-duration">时长</span>
          </div>
          <div class="episode-list" id="episodeList"></div>
        </div>
      </div>

      <div class="setting-row" id="qualityRow">
        <div class="setting-info">
          <div class="setting-title" id="qualityTitle">清晰度</div>
          <div class="setting-subtitle" id="qualityHint">画质越高，文件越大</div>
        </div>
        <div class="lx-select" id="qualitySelect">
          <button type="button" class="lx-select-trigger">
            <span class="lx-select-value">—</span>
            <svg class="lx-select-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
          </button>
        </div>
      </div>

      <div class="setting-row" id="videoCodecRow">
        <div class="setting-info">
          <div class="setting-title" id="videoCodecTitle">视频编码</div>
          <div class="setting-subtitle" id="codecHint">AVC 兼容性更好，AV1 体积更小</div>
        </div>
        <div class="lx-select" id="videoCodecSelect">
          <button type="button" class="lx-select-trigger">
            <span class="lx-select-value">—</span>
            <svg class="lx-select-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
          </button>
        </div>
      </div>

      <div class="setting-row" id="audioQualityRow">
        <div class="setting-info">
          <div class="setting-title">音频质量</div>
          <div class="setting-subtitle" id="audioHint">码率越高，声音细节越多</div>
        </div>
        <div class="lx-select" id="audioSelect">
          <button type="button" class="lx-select-trigger">
            <span class="lx-select-value">—</span>
            <svg class="lx-select-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
          </button>
        </div>
      </div>

      <div class="setting-row" id="audioCodecRow">
        <div class="setting-info">
          <div class="setting-title">音频编码</div>
          <div class="setting-subtitle" id="audioCodecHint">AAC 兼容性最好</div>
        </div>
        <div class="lx-select" id="audioCodecSelect">
          <button type="button" class="lx-select-trigger">
            <span class="lx-select-value">—</span>
            <svg class="lx-select-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
          </button>
        </div>
      </div>

      <div class="setting-row" id="mergeFormatRow">
        <div class="setting-info">
          <div class="setting-title">合并格式</div>
          <div class="setting-subtitle">下载完成后自动合并为所选容器</div>
        </div>
        <div class="lx-select" id="mergeFormat">
          <button type="button" class="lx-select-trigger">
            <span class="lx-select-value">MP4</span>
            <svg class="lx-select-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
          </button>
        </div>
      </div>

      <p class="tip error-text" id="formError" hidden></p>
    </div>
  </main>

  <footer class="footer">
    <button class="btn btn-primary" id="submitBtn" type="button" disabled>开始下载</button>
  </footer>

  <div class="lx-select-menu" id="globalSelectMenu" hidden></div>

  <script src="./bili-resource.js"></script>
</body>

</html>
