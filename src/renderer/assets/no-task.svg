<svg xmlns="http://www.w3.org/2000/svg" width="504" height="309" viewBox="0 0 504 309">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4C4C4"/>
      <stop offset="40%" stop-color="#8C8C8C"/>
      <stop offset="100%" stop-color="#3C3C3C"/>
    </linearGradient>

    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AAA" stop-opacity="0.6"/>
      <stop offset="18%" stop-color="#AAA" stop-opacity="0.08"/>
      <stop offset="82%" stop-color="#AAA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#AAA" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <filter id="lightShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.08"/>
    </filter>

    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D0D0D0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D0D0D0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D0D0D0" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#D0D0D0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D0D0D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="none" fill-rule="evenodd">

    <!-- 背景点阵 -->
    <g opacity="0.04">
      <circle cx="42" cy="42" r="1.5"/><circle cx="90" cy="42" r="1.5"/><circle cx="138" cy="42" r="1.5"/><circle cx="186" cy="42" r="1.5"/><circle cx="234" cy="42" r="1.5"/><circle cx="282" cy="42" r="1.5"/><circle cx="330" cy="42" r="1.5"/><circle cx="378" cy="42" r="1.5"/><circle cx="426" cy="42" r="1.5"/><circle cx="474" cy="42" r="1.5"/>
      <circle cx="42" cy="90" r="1.5"/><circle cx="90" cy="90" r="1.5"/><circle cx="138" cy="90" r="1.5"/><circle cx="186" cy="90" r="1.5"/><circle cx="234" cy="90" r="1.5"/><circle cx="282" cy="90" r="1.5"/><circle cx="330" cy="90" r="1.5"/><circle cx="378" cy="90" r="1.5"/><circle cx="426" cy="90" r="1.5"/><circle cx="474" cy="90" r="1.5"/>
      <circle cx="42" cy="138" r="1.5"/><circle cx="90" cy="138" r="1.5"/><circle cx="138" cy="138" r="1.5"/><circle cx="186" cy="138" r="1.5"/><circle cx="234" cy="138" r="1.5"/><circle cx="282" cy="138" r="1.5"/><circle cx="330" cy="138" r="1.5"/><circle cx="378" cy="138" r="1.5"/><circle cx="426" cy="138" r="1.5"/><circle cx="474" cy="138" r="1.5"/>
      <circle cx="42" cy="186" r="1.5"/><circle cx="90" cy="186" r="1.5"/><circle cx="138" cy="186" r="1.5"/><circle cx="186" cy="186" r="1.5"/><circle cx="234" cy="186" r="1.5"/><circle cx="282" cy="186" r="1.5"/><circle cx="330" cy="186" r="1.5"/><circle cx="378" cy="186" r="1.5"/><circle cx="426" cy="186" r="1.5"/><circle cx="474" cy="186" r="1.5"/>
      <circle cx="42" cy="234" r="1.5"/><circle cx="90" cy="234" r="1.5"/><circle cx="138" cy="234" r="1.5"/><circle cx="186" cy="234" r="1.5"/><circle cx="234" cy="234" r="1.5"/><circle cx="282" cy="234" r="1.5"/><circle cx="330" cy="234" r="1.5"/><circle cx="378" cy="234" r="1.5"/><circle cx="426" cy="234" r="1.5"/><circle cx="474" cy="234" r="1.5"/>
      <circle cx="42" cy="282" r="1.5"/><circle cx="90" cy="282" r="1.5"/><circle cx="138" cy="282" r="1.5"/><circle cx="186" cy="282" r="1.5"/><circle cx="234" cy="282" r="1.5"/><circle cx="282" cy="282" r="1.5"/><circle cx="330" cy="282" r="1.5"/><circle cx="378" cy="282" r="1.5"/><circle cx="426" cy="282" r="1.5"/><circle cx="474" cy="282" r="1.5"/>
    </g>

    <!-- 背景圆环 -->
    <circle cx="252" cy="145" r="112" stroke="#888" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6 10"/>
    <circle cx="252" cy="145" r="82" stroke="#888" stroke-opacity="0.14" stroke-width="1.5"/>

    <!-- 中心光晕 -->
    <ellipse cx="252" cy="145" rx="92" ry="92" fill="url(#centerGlow)"/>

    <!-- 进度环 -->
    <circle cx="252" cy="145" r="72" stroke="url(#ringGradient)" stroke-width="2.5" stroke-dasharray="140 212" stroke-linecap="round" transform="rotate(-90 252 145)"/>

    <!-- 进度环端点 -->
    <circle cx="252" cy="73" r="8" fill="url(#dotGlow)"/>
    <circle cx="252" cy="73" r="3.5" fill="#C4C4C4" opacity="0.65"/>

    <!-- 装饰点 -->
    <circle cx="168" cy="98" r="5" fill="#888" opacity="0.1"/>
    <circle cx="340" cy="88" r="3.5" fill="#888" opacity="0.08"/>
    <circle cx="358" cy="180" r="4.5" fill="#888" opacity="0.08"/>
    <circle cx="160" cy="192" r="3.5" fill="#888" opacity="0.1"/>
    <circle cx="298" cy="52" r="2.5" fill="#888" opacity="0.06"/>
    <circle cx="200" cy="62" r="2.5" fill="#888" opacity="0.06"/>
    <circle cx="132" cy="150" r="2" fill="#888" opacity="0.04"/>
    <circle cx="378" cy="136" r="2" fill="#888" opacity="0.04"/>

    <!-- 速度线 - 左侧 -->
    <line x1="192" y1="92" x2="204" y2="104" stroke="#C0C0C0" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="182" y1="112" x2="194" y2="124" stroke="#C0C0C0" stroke-opacity="0.09" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="188" y1="132" x2="198" y2="142" stroke="#C0C0C0" stroke-opacity="0.06" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 速度线 - 右侧 -->
    <line x1="312" y1="97" x2="300" y2="109" stroke="#C0C0C0" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="322" y1="117" x2="310" y2="129" stroke="#C0C0C0" stroke-opacity="0.09" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="316" y1="137" x2="306" y2="147" stroke="#C0C0C0" stroke-opacity="0.06" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 主体 -->
    <g filter="url(#shadow)">
      <path d="M252 72 L252 145" stroke="url(#mainGradient)" stroke-width="11" stroke-linecap="round"/>
      <path d="M222 118 L252 148 L282 118" stroke="url(#mainGradient)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M185 182 C190 210 205 225 225 225 L279 225 C299 225 314 210 319 182" stroke="url(#mainGradient)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M195 182 L225 182" stroke="url(#mainGradient)" stroke-width="11" stroke-linecap="round"/>
      <path d="M279 182 L309 182" stroke="url(#mainGradient)" stroke-width="11" stroke-linecap="round"/>

      <path d="M252 76 L252 135" stroke="url(#highlightGradient)" stroke-width="4" stroke-linecap="round"/>
      <path d="M228 122 L252 146 L276 122" stroke="url(#highlightGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M195 186 C198 208 212 219 228 219 L252 219" stroke="url(#highlightGradient)" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 浮动粒子 -->
    <g filter="url(#lightShadow)">
      <circle cx="246" cy="96" r="3.5" fill="#C4C4C4" opacity="0.4"/>
      <circle cx="266" cy="132" r="2.8" fill="#C4C4C4" opacity="0.32"/>
      <circle cx="234" cy="168" r="2.2" fill="#C4C4C4" opacity="0.25"/>
      <circle cx="260" cy="190" r="1.8" fill="#C4C4C4" opacity="0.16"/>
      <circle cx="242" cy="146" r="2" fill="#C4C4C4" opacity="0.2"/>
    </g>

    <ellipse cx="252" cy="248" rx="155" ry="34" fill="url(#groundShadow)"/>
  </g>
</svg>