name: Release

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ main ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install fpm (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install fpm

      - name: Build webpack bundles
        run: npm run build:github
        env:
          NODE_ENV: 'production'

      - name: Verify build output
        shell: bash
        run: |
          echo "Checking dist/electron directory..."
          ls -la dist/electron/ 2>/dev/null || dir dist\\electron\\ || echo "Directory listing failed"

          echo ""
          echo "Checking for index.js (main process)..."
          if [ -f "dist/electron/index.js" ]; then
            SIZE=$(stat -f%z dist/electron/index.js 2>/dev/null || stat -c%s dist/electron/index.js 2>/dev/null || echo "unknown")
            echo "✓ index.js found ($SIZE bytes)"
          else
            echo "✗ index.js not found"
            echo "Contents of dist directory:"
            find dist -type f 2>/dev/null || echo "find command failed"
            exit 1
          fi

          echo ""
          echo "Checking for assets directory (renderer)..."
          if [ -d "dist/electron/assets" ]; then
            ASSET_COUNT=$(find dist/electron/assets -type f 2>/dev/null | wc -l)
            echo "✓ assets directory found ($ASSET_COUNT files)"
          else
            echo "⚠ assets directory not found (may be normal if renderer is bundled differently)"
          fi

          echo ""
          echo "Checking for shared/locales (main process assets)..."
          if [ -d "dist/electron/shared/locales" ]; then
            LOCALE_COUNT=$(find dist/electron/shared/locales -type f 2>/dev/null | wc -l)
            echo "✓ shared/locales found ($LOCALE_COUNT files)"
          else
            echo "✗ shared/locales not found"
            exit 1
          fi

          echo ""
          echo "✓ Build verification passed!"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 先构建全部安装器但不发布（--publish never），
      # 测试通过后才在 release job 中统一上传到同一草稿
      - name: Build installers with electron-builder (no publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZE: 'true'
          DEBUG: 'electron-builder'
        run: |
          echo "Starting electron-builder..."
          touch electron-builder.log
          set -o pipefail
          npx electron-builder --publish never 2>&1 | tee electron-builder.log
          EXIT_CODE=$?
          set +o pipefail
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ electron-builder failed with exit code $EXIT_CODE"
            echo ""
            echo "Checking if app.asar was created..."
            if [ -f "release/mac/Lerxu.app/Contents/Resources/app.asar" ]; then
              echo "app.asar exists, checking contents..."
              npx asar list "release/mac/Lerxu.app/Contents/Resources/app.asar" | head -50
            elif [ -f "release/win-unpacked/resources/app.asar" ]; then
              echo "app.asar exists (Windows), checking contents..."
              npx asar list "release/win-unpacked/resources/app.asar" | head -50
            elif [ -f "release/linux-unpacked/resources/app.asar" ]; then
              echo "app.asar exists (Linux), checking contents..."
              npx asar list "release/linux-unpacked/resources/app.asar" | head -50
            else
              echo "app.asar not found"
            fi
            echo ""
            echo "Last 50 lines of output:"
            tail -n 50 electron-builder.log || echo "(no log content)"
            exit $EXIT_CODE
          fi
        shell: bash

      # 构建后运行时测试（引擎 RPC / HTTP 下载 / BT 下载 / 应用冒烟），
      # 任一失败则本步骤失败，产物不会上传
      - name: Post-build runtime tests (engine / HTTP / BT / app smoke)
        uses: ./.github/actions/app-tests
        timeout-minutes: 20

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ matrix.platform }}
          path: |
            electron-builder.log
            *.log
            release/*.yml
          if-no-files-found: 'ignore'
          retention-days: 7

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: app-logs-release-${{ matrix.platform }}
          path: |
            ~/Library/Application Support/lerxu/logs/
            ~/Library/Application Support/Lerxu/logs/
            ~/.config/lerxu/logs/
            ~/.config/Lerxu/logs/
            /c/Users/runneradmin/AppData/Roaming/lerxu/logs/
            /c/Users/runneradmin/AppData/Roaming/Lerxu/logs/
          if-no-files-found: 'ignore'
          retention-days: 7

      # 将本平台构建产物上传为 Actions artifact，
      # 由下游 release job 收集后统一上传到同一草稿
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: 'error'
          retention-days: 7

  # Android 客户端构建（APK）
  # 与桌面三平台并列；引擎二进制随仓库分发（jniLibs + assets 双份），
  # 构建前校验其完整性与架构，构建后校验 APK 内确实打进了引擎。
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 签名凭据（**必需**）：secrets 上下文**不能**在 `if:` 条件中引用
    # （GitHub 会报 "Unrecognized named-value: 'secrets'"），因此统一在 job 级
    # env 中注入。工作流只构建签名版 APK——任一凭据缺失直接失败，
    # 不再产出开发版（debug）或未签名（unsigned）产物。
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: ./.github/actions/android-sdk

      - name: Verify Android engine binary
        run: |
          set -e
          ASSET=Android/app/src/main/assets/xferrust
          LIB=Android/app/src/main/jniLibs/arm64-v8a/libxferrust.so
          for f in "$ASSET" "$LIB"; do
            [ -f "$f" ] || { echo "::error::missing engine: $f"; exit 1; }
          done
          a=$(sha256sum "$ASSET" | cut -d' ' -f1)
          b=$(sha256sum "$LIB" | cut -d' ' -f1)
          [ "$a" = "$b" ] || { echo "::error::engine copies differ"; exit 1; }
          file "$LIB" | grep -q 'ARM aarch64' || { echo "::error::engine is not aarch64"; exit 1; }
          for opt in enable-dht6 disk-cache bt-save-metadata enable-peer-exchange; do
            grep -qa "$opt" "$LIB" || { echo "::error::engine missing option: $opt"; exit 1; }
          done
          echo "✓ Android engine verified"

      # 签名（必需）：工作流**只产出已签名版 APK**——未配置凭据直接失败，
      # 不再生成开发版（debug）或未签名（unsigned）产物。
      - name: Decode release keystore (required)
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置——工作流只构建签名版 APK。请在仓库配置 secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
            exit 1
          fi
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD 未配置"; exit 1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "::error::ANDROID_KEY_ALIAS 未配置"; exit 1; }
          [ -n "$ANDROID_KEY_PASSWORD" ] || { echo "::error::ANDROID_KEY_PASSWORD 未配置"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # 收紧权限：keystore 含私钥，仅允许当前用户读写
          chmod 600 "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "✓ Release keystore decoded (600, under RUNNER_TEMP)"

      # 只构建签名版 release APK（签名由 app/build.gradle.kts 的 signingConfigs
      # 读取 job env 注入的 ANDROID_KEYSTORE_PATH 等变量完成）
      - name: Build signed APK
        run: |
          cd Android
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK contents & signature
        run: |
          set -e
          apk=Android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::missing $apk（应产出已签名的 app-release.apk）"
            find Android/app/build/outputs/apk -type f 2>/dev/null | head || true
            exit 1
          fi
          echo "=== $apk ($(stat -c%s "$apk") bytes) ==="

          # 版本一致性：APK 的 versionName 必须与仓库根 package.json 的 version 逐字符相同。
          # 桌面端 app.getVersion() 与 release tag 同源于该字段，这里做最后一道兜底，
          # 避免「手机端版本 ≠ 桌面端版本」悄悄发布出去。
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          ACTUAL_VERSION=$(node -p "require('./Android/app/build/outputs/apk/release/output-metadata.json').elements[0].versionName")
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::APK versionName=$ACTUAL_VERSION 与 package.json version=$EXPECTED_VERSION 不一致"
            exit 1
          fi
          echo "✓ version consistent: $ACTUAL_VERSION"

          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libxferrust.so' || { echo "::error::$apk missing engine (jniLibs)"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/xferrust' || { echo "::error::$apk missing engine (assets)"; exit 1; }
          echo "✓ engine packaged"

          # 必须已签名（否则下游发布的是可被篡改的未签名包）
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::$apk 未签名"; exit 1; }
            echo "✓ signature verified"
          else
            echo "::error::apksigner not found in $ANDROID_SDK_ROOT/build-tools"
            exit 1
          fi
          echo "✓ APK contents verified"

      # 归集到 release/ 供下游 release job 统一下载（命名与桌面一致：release-artifacts-*）
      - name: Stage artifacts
        run: |
          set -e
          mkdir -p release
          find Android/app/build/outputs/apk -name '*.apk' -exec cp {} release/ \;
          ls -la release/

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts-android
          path: release/*.apk
          if-no-files-found: 'error'
          retention-days: 7

      # 双保险：显式删除签名密钥（RUNNER_TEMP 在 job 结束后本会清理，
      # 显式删掉可防止未来误把该目录加入 artifact）
      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" || true
          echo "✓ signing keystore removed from runner"

  # 收集所有平台产物，统一上传到同一版本的草稿 release
  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release/

      # 浏览器扩展：同一份源码产出 Chromium 与 Firefox 两个包
      # （Firefox 只读取名为 manifest.json 的文件，不支持 MV3 的
      #  background.service_worker，也不接受 downloads.ui 权限；
      #  打包与 AMO 提交约束的自检见 scripts/build-extension.js —— 归档根必须有
      #  manifest.json，且不得含 __MACOSX/._*/.DS_Store/开发脚本）
      - name: Build & stage browser extension
        run: |
          set -e
          node scripts/build-extension.js

          # 对提交给 AMO 的那个归档直接做官方 lint（errors 必须为 0）
          ZIP=$(ls dist/extension/artifacts/lerxu-webextension-firefox-*.zip | head -1)
          npx --yes web-ext@8 lint --source-dir "$ZIP" --output json > /tmp/webext-lint.json
          node -e "
            const r = require('/tmp/webext-lint.json');
            console.log('web-ext lint — errors:', r.summary.errors, 'warnings:', r.summary.warnings);
            for (const e of (r.errors || [])) console.error('  ERROR', e.code, e.message);
            if (r.summary.errors > 0) process.exit(1);
          "

          mkdir -p release
          cp dist/extension/artifacts/* release/
          echo "扩展产物：" && ls -la release/lerxu-webextension-*

      - name: Verify artifacts
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          files=()
          for pattern in \
            release/*.exe release/*.dmg release/*.zip \
            release/*.AppImage release/*.deb release/*.apk release/*.xpi \
            release/*.blockmap release/latest*.yml; do
            for f in $pattern; do
              files+=("$f")
            done
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release artifacts found"
            ls -la release/ || true
            exit 1
          fi
          echo "Found ${#files[@]} artifacts:"
          printf '  %s\n' "${files[@]}"

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          shopt -s nullglob

          VERSION="$VERSION"
          echo "Looking for existing release with tag $VERSION ..."

          # 查找已有 release（草稿或已发布），如果存在则复用
          RELEASE_ID=""
          IS_DRAFT=""
          ALREADY_PUBLISHED="false"

          # 通过 gh release view 查找
          if gh release view "$VERSION" > /dev/null 2>&1; then
            # 获取 release 详情
            RELEASE_JSON=$(gh release view "$VERSION" --json id,isDraft,tagName)
            RELEASE_ID=$(echo "$RELEASE_JSON" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).id")
            IS_DRAFT=$(echo "$RELEASE_JSON" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).isDraft")

            if [ "$IS_DRAFT" = "false" ]; then
              echo "Release $VERSION is already published — skipping upload to avoid overwriting."
              echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Found existing draft release (ID: $RELEASE_ID), will upload artifacts to it."
          else
            echo "No existing release found for $VERSION, creating a new draft ..."
            gh release create "$VERSION" \
              --draft \
              --title "$VERSION" \
              --notes ""
            echo "Created new draft release for $VERSION"
          fi

          # 收集所有产物文件
          files=()
          for pattern in \
            release/*.exe release/*.dmg release/*.zip \
            release/*.AppImage release/*.deb release/*.apk release/*.xpi \
            release/*.blockmap release/latest*.yml; do
            for f in $pattern; do
              files+=("$f")
            done
          done

          echo "Uploading ${#files[@]} artifacts to release $VERSION:"
          printf '  %s\n' "${files[@]}"

          # 上传产物到 release（已存在则追加，不覆盖草稿的 body 内容）
          # gh release upload 对已有同名文件会报错，先删除旧的再上传
          # 使用 --clobber 选项允许覆盖同名产物
          gh release upload "$VERSION" "${files[@]}" --clobber

          echo "✓ All artifacts uploaded to release $VERSION"

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            echo "ℹ️ Release $VERSION is already published, skipped uploading."
          else
            echo "✓ Draft release $VERSION updated with all platform artifacts."
          fi
