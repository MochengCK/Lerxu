name: Release

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ main ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install fpm (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install fpm

      - name: Build webpack bundles
        run: npm run build:github
        env:
          NODE_ENV: 'production'

      - name: Verify build output
        shell: bash
        run: |
          echo "Checking dist/electron directory..."
          ls -la dist/electron/ 2>/dev/null || dir dist\\electron\\ || echo "Directory listing failed"

          echo ""
          echo "Checking for index.js (main process)..."
          if [ -f "dist/electron/index.js" ]; then
            SIZE=$(stat -f%z dist/electron/index.js 2>/dev/null || stat -c%s dist/electron/index.js 2>/dev/null || echo "unknown")
            echo "✓ index.js found ($SIZE bytes)"
          else
            echo "✗ index.js not found"
            echo "Contents of dist directory:"
            find dist -type f 2>/dev/null || echo "find command failed"
            exit 1
          fi

          echo ""
          echo "Checking for assets directory (renderer)..."
          if [ -d "dist/electron/assets" ]; then
            ASSET_COUNT=$(find dist/electron/assets -type f 2>/dev/null | wc -l)
            echo "✓ assets directory found ($ASSET_COUNT files)"
          else
            echo "⚠ assets directory not found (may be normal if renderer is bundled differently)"
          fi

          echo ""
          echo "Checking for shared/locales (main process assets)..."
          if [ -d "dist/electron/shared/locales" ]; then
            LOCALE_COUNT=$(find dist/electron/shared/locales -type f 2>/dev/null | wc -l)
            echo "✓ shared/locales found ($LOCALE_COUNT files)"
          else
            echo "✗ shared/locales not found"
            exit 1
          fi

          echo ""
          echo "✓ Build verification passed!"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 先构建全部安装器但不发布（--publish never），
      # 测试通过后才在 release job 中统一上传到同一草稿
      - name: Build installers with electron-builder (no publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZE: 'true'
          DEBUG: 'electron-builder'
        run: |
          echo "Starting electron-builder..."
          touch electron-builder.log
          set -o pipefail
          npx electron-builder --publish never 2>&1 | tee electron-builder.log
          EXIT_CODE=$?
          set +o pipefail
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ electron-builder failed with exit code $EXIT_CODE"
            echo ""
            echo "Checking if app.asar was created..."
            if [ -f "release/mac/Lerxu.app/Contents/Resources/app.asar" ]; then
              echo "app.asar exists, checking contents..."
              npx asar list "release/mac/Lerxu.app/Contents/Resources/app.asar" | head -50
            elif [ -f "release/win-unpacked/resources/app.asar" ]; then
              echo "app.asar exists (Windows), checking contents..."
              npx asar list "release/win-unpacked/resources/app.asar" | head -50
            elif [ -f "release/linux-unpacked/resources/app.asar" ]; then
              echo "app.asar exists (Linux), checking contents..."
              npx asar list "release/linux-unpacked/resources/app.asar" | head -50
            else
              echo "app.asar not found"
            fi
            echo ""
            echo "Last 50 lines of output:"
            tail -n 50 electron-builder.log || echo "(no log content)"
            exit $EXIT_CODE
          fi
        shell: bash

      # 构建后运行时测试（引擎 RPC / HTTP 下载 / BT 下载 / 应用冒烟），
      # 任一失败则本步骤失败，产物不会上传
      - name: Post-build runtime tests (engine / HTTP / BT / app smoke)
        uses: ./.github/actions/app-tests
        timeout-minutes: 20

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ matrix.platform }}
          path: |
            electron-builder.log
            *.log
            release/*.yml
          if-no-files-found: 'ignore'
          retention-days: 7

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: app-logs-release-${{ matrix.platform }}
          path: |
            ~/Library/Application Support/lerxu/logs/
            ~/Library/Application Support/Lerxu/logs/
            ~/.config/lerxu/logs/
            ~/.config/Lerxu/logs/
            /c/Users/runneradmin/AppData/Roaming/lerxu/logs/
            /c/Users/runneradmin/AppData/Roaming/Lerxu/logs/
          if-no-files-found: 'ignore'
          retention-days: 7

      # 将本平台构建产物上传为 Actions artifact，
      # 由下游 release job 收集后统一上传到同一草稿
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: 'error'
          retention-days: 7

  # 收集所有平台产物，统一上传到同一版本的草稿 release
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release/

      - name: Verify artifacts
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          files=()
          for pattern in \
            release/*.exe release/*.dmg release/*.zip \
            release/*.AppImage release/*.deb \
            release/*.blockmap release/latest*.yml; do
            for f in $pattern; do
              files+=("$f")
            done
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release artifacts found"
            ls -la release/ || true
            exit 1
          fi
          echo "Found ${#files[@]} artifacts:"
          printf '  %s\n' "${files[@]}"

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          shopt -s nullglob

          VERSION="$VERSION"
          echo "Looking for existing release with tag $VERSION ..."

          # 查找已有 release（草稿或已发布），如果存在则复用
          RELEASE_ID=""
          IS_DRAFT=""
          ALREADY_PUBLISHED="false"

          # 通过 gh release view 查找
          if gh release view "$VERSION" > /dev/null 2>&1; then
            # 获取 release 详情
            RELEASE_JSON=$(gh release view "$VERSION" --json id,isDraft,tagName)
            RELEASE_ID=$(echo "$RELEASE_JSON" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).id")
            IS_DRAFT=$(echo "$RELEASE_JSON" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).isDraft")

            if [ "$IS_DRAFT" = "false" ]; then
              echo "Release $VERSION is already published — skipping upload to avoid overwriting."
              echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Found existing draft release (ID: $RELEASE_ID), will upload artifacts to it."
          else
            echo "No existing release found for $VERSION, creating a new draft ..."
            gh release create "$VERSION" \
              --draft \
              --title "$VERSION" \
              --notes ""
            echo "Created new draft release for $VERSION"
          fi

          # 收集所有产物文件
          files=()
          for pattern in \
            release/*.exe release/*.dmg release/*.zip \
            release/*.AppImage release/*.deb \
            release/*.blockmap release/latest*.yml; do
            for f in $pattern; do
              files+=("$f")
            done
          done

          echo "Uploading ${#files[@]} artifacts to release $VERSION:"
          printf '  %s\n' "${files[@]}"

          # 上传产物到 release（已存在则追加，不覆盖草稿的 body 内容）
          # gh release upload 对已有同名文件会报错，先删除旧的再上传
          # 使用 --clobber 选项允许覆盖同名产物
          gh release upload "$VERSION" "${files[@]}" --clobber

          echo "✓ All artifacts uploaded to release $VERSION"

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            echo "ℹ️ Release $VERSION is already published, skipped uploading."
          else
            echo "✓ Draft release $VERSION updated with all platform artifacts."
          fi
