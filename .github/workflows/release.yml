name: Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'

jobs:
  pre-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete existing release by tag
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG_NAME
            const { owner, repo } = context.repo
            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.data.id })
            } catch (e) {
              core.info(`skip delete: ${e.message}`)
            }
  build-and-release:
    needs: pre-clean
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install fpm (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install fpm

      - name: Build webpack bundles
        run: npm run build:github
        env:
          NODE_ENV: 'production'

      - name: Verify build output
        shell: bash
        run: |
          echo "Checking dist/electron directory..."
          ls -la dist/electron/ || true
          if [ -f "dist/electron/main.js" ]; then
            echo "✓ main.js found ($(stat -f%z dist/electron/main.js 2>/dev/null || stat -c%s dist/electron/main.js) bytes)"
          else
            echo "✗ main.js not found"
            exit 1
          fi
          if [ -f "dist/electron/renderer.js" ]; then
            echo "✓ renderer.js found ($(stat -f%z dist/electron/renderer.js 2>/dev/null || stat -c%s dist/electron/renderer.js) bytes)"
          else
            echo "✗ renderer.js not found"
            exit 1
          fi
          echo "Build verification passed!"

      - name: Build and publish with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZE: 'true'
          DEBUG: 'electron-builder'
        run: npx electron-builder --publish onTagOrDraft
