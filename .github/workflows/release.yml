name: Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'

jobs:
  pre-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete existing release by tag
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG_NAME
            const { owner, repo } = context.repo
            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.data.id })
            } catch (e) {
              core.info(`skip delete: ${e.message}`)
            }
  build-and-release:
    needs: pre-clean
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install fpm (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install fpm

      - name: Bundle Linux engine runtime libs
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          BIN="extra/linux/x64/engine/fluxcore"
          LIB_DIR="extra/linux/x64/engine/lib"
          mkdir -p "$LIB_DIR"
          if [[ ! -f "$BIN" ]]; then
            echo "skip: $BIN not found"
            exit 0
          fi

          echo "Collecting shared libs for $BIN"
          ldd "$BIN" | awk '/=> \// {print $3}' | while read -r lib; do
            name="$(basename "$lib")"
            case "$name" in
              libssh2.so.*|libgcrypt.so.*|libgpg-error.so.*|libgmp.so.*|libcares.so.*|libxml2.so.*|libsqlite3.so.*|libz.so.*|libexpat.so.*)
                cp -Lv "$lib" "$LIB_DIR/$name" || true
                ;;
            esac
          done

          echo "Bundled libs:"
          ls -la "$LIB_DIR" || true

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZE: 'true'
        run: npm run release
