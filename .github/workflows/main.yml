name: CI Tests

on:
  push:
    branches: [ main, develop ]
    # 排除标签推送，避免与release工作流重复
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [ main ]
  schedule:
    # 每周一早上6点运行完整测试
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 代码质量检查
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run ESLint
      run: npm run lint

    - name: Check package.json syntax
      run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

    - name: Verify build configuration
      run: |
        node -e "
          const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
          const electronBuilder = JSON.parse(require('fs').readFileSync('electron-builder.json', 'utf8'));
          console.log('Package name:', pkg.name);
          console.log('Electron builder config verified');
        "

    - name: Verify engine artifacts (all platforms)
      run: |
        # 各发布组合的引擎二进制必须随仓库存在（缺失告警，交由构建运行时测试兜底）
        for platform in darwin/x64 darwin/arm64 win32/x64 linux/x64 linux/arm64; do
          bin="extra/${platform}/engine/xfercore"
          if [ -f "$bin" ]; then
            echo "Engine found: $bin"
          else
            echo "::warning::Engine binary missing: $bin"
          fi
        done

  # 多平台构建 + 运行时测试
  # 构建完成后立即在同一台 runner 上执行：
  #   1. 引擎测试 —— 对打包后的引擎二进制验证 RPC 探活、HTTP 下载、BT 下载（本地闭环 swarm）
  #   2. 应用冒烟 —— 启动打包后的应用，验证「应用主进程 → 引擎子进程 → RPC」链路，
  #      并经应用引擎做一次 HTTP 下载端到端校验
  build-and-test:
    name: Build & Runtime Test (${{ matrix.os }})
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Build application (unpacked)
      run: npm run build:dir
      env:
        # 禁用代码签名和公证以加速测试
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        SKIP_NOTARIZE: 'true'

    - name: Post-build runtime tests (engine / HTTP / BT / app smoke)
      uses: ./.github/actions/app-tests
      timeout-minutes: 20

    - name: Upload app logs on failure
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: app-logs-${{ matrix.platform }}
        path: |
          ~/Library/Application Support/lerxu/logs/
          ~/Library/Application Support/Lerxu/logs/
          ~/.config/lerxu/logs/
          ~/.config/Lerxu/logs/
          /c/Users/runneradmin/AppData/Roaming/lerxu/logs/
          /c/Users/runneradmin/AppData/Roaming/Lerxu/logs/
        if-no-files-found: 'ignore'
        retention-days: 7

  # 扩展功能测试
  extension-test:
    name: Browser Extension Test
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Test extension manifest
      run: |
        # 验证浏览器扩展的manifest文件
        node -e "
          const manifest = JSON.parse(require('fs').readFileSync('extensions/lerxu-webextension/manifest.json', 'utf8'));
          if (!manifest.name || !manifest.version || !manifest.manifest_version) {
            throw new Error('Invalid extension manifest');
          }
          console.log('Extension manifest validated:', manifest.name, manifest.version);
        "

    - name: Verify extension locales
      run: |
        # 检查所有语言文件是否存在且格式正确
        for lang in en de es fr ja ko ru zh_CN zh_TW; do
          if [ -f "extensions/lerxu-webextension/_locales/$lang/messages.json" ]; then
            node -e "
              try {
                JSON.parse(require('fs').readFileSync('extensions/lerxu-webextension/_locales/$lang/messages.json', 'utf8'));
                console.log('$lang locale file is valid JSON');
              } catch (e) {
                console.error('$lang locale file has invalid JSON:', e.message);
                process.exit(1);
              }
            "
          else
            echo "Warning: $lang locale file not found"
          fi
        done

  # 最终报告
  test-report:
    name: Test Report
    needs: [lint-and-typecheck, build-and-test, extension-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Generate test report
      run: |
        echo "=== CI Test Report ==="
        echo "Build Date: $(date)"
        echo "Commit: $GITHUB_SHA"
        echo "Branch: $GITHUB_REF"
        echo ""
        echo "Test Results:"
        echo "- Lint & Type Check: ${{ needs.lint-and-typecheck.result }}"
        echo "- Build & Runtime Test (Linux / Windows / macOS): ${{ needs.build-and-test.result }}"
        echo "  - engine RPC probe: covered"
        echo "  - HTTP download test: covered"
        echo "  - BT download test (local swarm): covered"
        echo "  - app smoke test (launch / engine rpc / http): covered"
        echo "- Extension Test: ${{ needs.extension-test.result }}"
        echo ""
        echo "Overall Status: ${{ job.status }}"
