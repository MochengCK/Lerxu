name: 🐛 Bug 报告（中文）
description: 反馈 LinkCore 的问题
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您抽出时间填写 Bug 报告。
        提交前请先搜索已有 issues，避免重复。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      description: 问题出在哪个模块？
      options:
        - 应用（界面/设置）
        - 下载/引擎（HTTP/FTP/BT/磁力）
        - 安装/更新
        - 浏览器扩展
        - 其他
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug 描述
      description: 简要描述发生了什么，以及你期望发生什么。
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 软件版本
      description: 例如 v1.8.15（如与安装包类型有关，也请注明）
      placeholder: v1.8.15
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本
      placeholder: Windows 11 23H2 / macOS 15.x / Ubuntu 24.04 ...
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: CPU 架构
      options:
        - x64
        - arm64
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 复现步骤
      description: 请给出稳定可复现的步骤。
      placeholder: |
        1. 前往 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 查看错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: |
        如方便请提供日志或截图。
        粘贴日志时请使用代码块包裹。

  - type: checkboxes
    id: checkboxes
    attributes:
      label: 验证
      description: 提交前请确认：
      options:
        - label: 我已搜索过现有 issues，确认不是重复问题。
          required: true
        - label: 我提供的步骤可以稳定复现此问题。
          required: true
